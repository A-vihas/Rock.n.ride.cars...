<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rock 'n' Ride — 3D Stunt Racing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hud">
  <div class="brand">ROCK <span>’N’</span> RIDE <b>3D</b></div>
  <div class="stats">
    <div><small>SPEED</small><strong id="speed">0</strong><em>KM/H</em></div>
    <div><small>AIR</small><strong id="air">0.0</strong><em>M</em></div>
    <div><small>RAMPS</small><strong id="rampCount">0</strong><em>/15</em></div>
  </div>
  <div class="help">WASD / ARROWS • SPACE = BOOST • C = CAMERA • R = RESET</div>
</div>
<div id="message">GET READY</div>
<div id="touch">
  <div class="pad">
    <button data-key="left">◀</button><button data-key="right">▶</button>
  </div>
  <div class="pedals">
    <button data-key="brake">BRAKE</button>
    <button class="boost" data-key="boost">BOOST</button>
    <button data-key="gas">GAS</button>
  </div>
</div>
<div id="start">
  <div class="card">
    <div class="tag">FULL 3D STUNT WORLD</div>
    <h1>ROCK <span>’N’</span> RIDE</h1>
    <p>15 hand-built stunt ramps. No flat 2D track. Drive, jump, land and explore a real 3D world.</p>
    <button id="startBtn">START RACE</button>
  </div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<script type="module" src="game.js"></script>
</body>
</html>
